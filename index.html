<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andreas Ioannidis</title>
<meta name="description" content="Andreas Ioannidis. Principal software engineer.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-.5 -.5 4 4'%3E%3Cpath fill='%23ff4d00' d='M1 0h1v1H1zM2 1h1v1H2zM0 2h3v1H0z'/%3E%3C/svg%3E">
<style>
  :root { --bg: #0b0b0b; --ink: #ebe8e1; --dim: #77756f; --c: 4px; }

  html, body { height: 100%; margin: 0; overflow: hidden; }

  body {
    background: var(--bg) radial-gradient(circle, #1c1c1c .7px, transparent 1px) 0 0 / var(--c) var(--c);
    color: var(--dim);
    font: 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .16em;
    text-transform: uppercase;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }

  h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  nav { position: fixed; display: flex; gap: 3em; }
  a { color: inherit; text-decoration: none; padding: 8px 0; }
  a:hover, a:focus-visible { color: var(--ink); outline: none; }

  small { position: fixed; right: 20px; bottom: 20px; font-size: 10px; color: #3a3936; }
</style>
</head>
<body>
<h1>Andreas Ioannidis</h1>
<canvas aria-hidden="true"></canvas>
<nav>
  <a href="https://github.com/andreasioan">GitHub ↗</a>
  <a href="https://www.linkedin.com/in/andreas-ioannidis/">LinkedIn ↗</a>
</nav>
<small aria-hidden="true">B3/S23</small>
<script>
  // Conway's Game of Life, with one extra rule: every cell remembers what it
  // is supposed to be. Disturb a cell and it runs Life for a while, then cools
  // and snaps back. Chaos in, name out.

  const GLYPHS = {
    A: ['.###.', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
    N: ['#...#', '#...#', '##..#', '#.#.#', '#..##', '#...#', '#...#'],
    D: ['####.', '#...#', '#...#', '#...#', '#...#', '#...#', '####.'],
    R: ['####.', '#...#', '#...#', '####.', '#.#..', '#..#.', '#...#'],
    E: ['#####', '#....', '#....', '####.', '#....', '#....', '#####'],
    S: ['.####', '#....', '#....', '.###.', '....#', '....#', '####.'],
    I: ['###', '.#.', '.#.', '.#.', '.#.', '.#.', '###'],
    O: ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
    ' ': ['...', '...', '...', '...', '...', '...', '...'],
  };
  const COLORS = ['#ebe8e1', '#c42200', '#ff4d00', '#ff9d2e']; // settled, then hot: cooling → fresh
  const TICK = 1000 / 30;

  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const nav = document.querySelector('nav');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, c, cols, rows, cur, nxt, tgt, heat;
  let running = false, last = 0, acc = 0, prev = null;

  const widthOf = line => [...line].reduce((w, ch) => w + GLYPHS[ch][0].length + 1, -1);
  const brush = () => Math.max(3, Math.round(32 / c));

  function layout(intro) {
    W = innerWidth;
    H = innerHeight;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // One line when there's room, two when there isn't. Then pick the biggest
    // pixel scale (k cells per font pixel) that still leaves cells >= 4px.
    const lines = W / H > 1.1 ? ['ANDREAS IOANNIDIS'] : ['ANDREAS', 'IOANNIDIS'];
    const wF = Math.max(...lines.map(widthOf));
    const hF = lines.length * 10 - 3;
    let k = 4;
    for (; k > 1; k--) if (Math.min(.86 * W / wF, .45 * H / hF) / k >= 4) break;
    c = Math.max(3, Math.floor(Math.min(.86 * W / wF, .45 * H / hF) / k));
    document.body.style.setProperty('--c', c + 'px');

    // The grid has a one-cell dead border so neighbour lookups never go out of bounds.
    cols = Math.ceil(W / c) + 2;
    rows = Math.ceil(H / c) + 2;
    cur = new Uint8Array(cols * rows);
    nxt = new Uint8Array(cols * rows);
    tgt = new Uint8Array(cols * rows);
    heat = new Uint8Array(cols * rows);

    const x0 = Math.floor((cols - wF * k) / 2);
    const y0 = Math.floor((rows - hF * k) / 2.15);
    lines.forEach((line, li) => {
      let x = x0;
      for (const ch of line) {
        GLYPHS[ch].forEach((row, gy) => [...row].forEach((p, gx) => {
          if (p !== '#') return;
          for (let dy = 0; dy < k; dy++) for (let dx = 0; dx < k; dx++)
            tgt[(y0 + (li * 10 + gy) * k + dy) * cols + x + gx * k + dx] = 1;
        }));
        x += (GLYPHS[ch][0].length + 1) * k;
      }
    });

    nav.style.left = (x0 - 1) * c + 'px';
    nav.style.top = (y0 - 1 + hF * k) * c + Math.max(24, 3 * k * c) + 'px';

    // Boot from noise. Cells near the centre cool first, so the name
    // crystallises out of the middle while the edges are still burning.
    const cx = cols / 2, cy = rows / 2, far = Math.hypot(cx, cy);
    for (let i = 0; i < cur.length; i++) {
      const x = i % cols, y = i / cols | 0;
      if (!intro || still || !x || !y || x === cols - 1 || y === rows - 1) { cur[i] = tgt[i]; continue; }
      cur[i] = Math.random() < .25 ? 1 : 0;
      heat[i] = 10 + 75 * Math.hypot(x - cx, y - cy) / far + Math.random() * 35;
    }
    draw();
    if (intro && !still) wake();
  }

  function step() {
    let hot = 0;
    for (let y = 1; y < rows - 1; y++) {
      for (let x = 1, i = y * cols + 1; x < cols - 1; x++, i++) {
        if (!heat[i]) { nxt[i] = tgt[i]; continue; }
        const n = cur[i - cols - 1] + cur[i - cols] + cur[i - cols + 1]
                + cur[i - 1] + cur[i + 1]
                + cur[i + cols - 1] + cur[i + cols] + cur[i + cols + 1];
        nxt[i] = n === 3 || (n === 2 && cur[i]) ? 1 : 0;
        heat[i]--;
        hot++;
      }
    }
    [cur, nxt] = [nxt, cur];
    return hot;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const s = c - 1;
    const paths = COLORS.map(() => new Path2D());
    for (let y = 1; y < rows - 1; y++) {
      for (let x = 1, i = y * cols + 1; x < cols - 1; x++, i++) {
        if (!cur[i]) continue;
        const h = heat[i];
        paths[h === 0 ? 0 : h < 18 ? 1 : h < 45 ? 2 : 3].rect((x - 1) * c, (y - 1) * c, s, s);
      }
    }
    paths.forEach((p, j) => { ctx.fillStyle = COLORS[j]; ctx.fill(p); });
  }

  function frame(t) {
    acc += Math.min(t - (last || t), 100);
    last = t;
    let hot = 1;
    while (acc >= TICK) { hot = step(); acc -= TICK; }
    draw();
    if (hot) requestAnimationFrame(frame);
    else running = false;
  }

  function wake() {
    if (running) return;
    running = true;
    last = 0;
    acc = TICK;
    requestAnimationFrame(frame);
  }

  function disturb(px, py, r, density) {
    const gx = px / c + 1, gy = py / c + 1;
    for (let y = Math.max(1, Math.floor(gy - r)); y <= Math.min(rows - 2, gy + r); y++) {
      for (let x = Math.max(1, Math.floor(gx - r)); x <= Math.min(cols - 2, gx + r); x++) {
        const d = Math.hypot(x - gx, y - gy) / r;
        if (d > 1) continue;
        const i = y * cols + x;
        heat[i] = Math.max(heat[i], 30 + Math.random() * 70 * (1 - d));
        if (Math.random() < density * (1 - d)) cur[i] = 1;
      }
    }
    wake();
  }

  addEventListener('pointermove', e => {
    const p = { x: e.clientX, y: e.clientY };
    if (prev) {
      const r = brush();
      const n = Math.ceil(Math.hypot(p.x - prev.x, p.y - prev.y) / (r * c / 2)) || 1;
      for (let j = 1; j <= n; j++)
        disturb(prev.x + (p.x - prev.x) * j / n, prev.y + (p.y - prev.y) * j / n, r, .3);
    }
    prev = p;
  });
  addEventListener('pointerdown', e => {
    prev = { x: e.clientX, y: e.clientY };
    if (!e.target.closest('a')) disturb(prev.x, prev.y, brush() * 2.5, .35);
  });
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') prev = null; });
  document.documentElement.addEventListener('pointerleave', () => { prev = null; });

  let resizeTimer;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => layout(false), 150);
  });

  // Every so often a stray bit flips somewhere in the name. It heals.
  if (!still) (function cosmicRay() {
    setTimeout(() => {
      if (!document.hidden) {
        let i;
        do i = Math.random() * tgt.length | 0; while (!tgt[i]);
        disturb((i % cols - 1) * c, ((i / cols | 0) - 1) * c, brush() * .8, .15);
      }
      cosmicRay();
    }, 3000 + Math.random() * 6000);
  })();

  layout(true);
</script>
</body>
</html>
